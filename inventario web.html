<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { text-align:center; font-family:Arial; background:#f4f4f4; }
    h2 { color:#333; }
    #reader { width:300px; margin:auto; }
    #status { margin-top:20px; font-size:18px; font-weight:bold; }
    .ok { color:green; }
    .error { color:red; }
  </style>
</head>
<body>

<h2>📦 Escanear Inventario</h2>
<div id="reader"></div>
<p id="status">Esperando escaneo...</p>

<audio id="beep">
  <source src="https://actions.google.com/sounds/v1/beeps/beep_short.ogg" type="audio/ogg">
</audio>

<script>
let lastScan = "";
let scanning = true;

function onScanSuccess(decodedText) {
  if (!scanning) return;
  if (decodedText === lastScan) return;

  lastScan = decodedText;
  scanning = false;

  // 🔊 Sonido
  const beep = document.getElementById("beep");
  beep.currentTime = 0;
  beep.play();

  // 📳 Vibración
  if (navigator.vibrate) navigator.vibrate(200);

  // Mostrar en pantalla
  const status = document.getElementById("status");
  status.innerText = "Escaneado: " + decodedText;
  status.className = "ok";

  // Enviar a Apps Script
  google.script.run
    .withSuccessHandler(() => {
      setTimeout(() => {
        scanning = true;
        status.innerText = "Esperando escaneo...";
        status.className = "";
      }, 1000);
    })
    .registrarDesdeWeb(decodedText);
}

function onScanError(error) {
  // ignorar errores de lectura
}

const html5QrCode = new Html5Qrcode("reader");
html5QrCode.start(
  { facingMode: "environment" },
  { fps: 10, qrbox: 250 },
  onScanSuccess,
  onScanError
);
</script>

</body>
</html>
